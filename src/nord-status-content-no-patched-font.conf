#+----------------+
#+ Plugin Support +
#+----------------+
#+--- tmux-prefix-highlight ---+
set -g @prefix_highlight_copy_mode_attr "fg=black,bg=brightcyan"

#+--------+
#+ Status +
#+--------+
#+--- Bars ---+
set -g status-left "#[fg=black,bg=blue,bold] #S "

# Build status-right based on enabled components
set -g status-right "#{prefix_highlight}"

# Only show date if enabled
if-shell '[ "$NORD_TMUX_SHOW_DATE" = "1" ]' {
  set -ga status-right "#[fg=white,bg=brightblack] ${NORD_TMUX_STATUS_DATE_FORMAT} "
}

# Only show time if enabled
if-shell '[ "$NORD_TMUX_SHOW_TIME" = "1" ]' {
  if-shell '[ "$NORD_TMUX_SHOW_DATE" = "1" ]' {
    set -ga status-right "#[fg=white,bg=brightblack,nobold,noitalics,nounderscore]|"
  }
  set -ga status-right "#[fg=white,bg=brightblack] ${NORD_TMUX_STATUS_TIME_FORMAT} "
}

# Always show hostname
set -ga status-right "#[fg=cyan,bg=brightblack,nobold,noitalics,nounderscore] #[fg=black,bg=cyan,bold] #H "

#+--- Windows ---+
set -g window-status-format " #[fg=white,bg=brightblack]#I #[fg=white,bg=brightblack]#W #F"
set -g window-status-current-format " #[fg=black,bg=cyan]#I#[fg=black,bg=cyan,nobold,noitalics,nounderscore] #[fg=black,bg=cyan]#W #F"
set -g window-status-separator ""